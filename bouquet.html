<title>Букет для тебя</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Manrope:wght@400;500&display=swap">
<style>
  /* Layout: ночное небо на весь экран, по центру букет, под ним стрелки и записка. Страница намеренно тёмная в любой теме. */
  :root {
    --bg: #090B1C;
    --fg: #ECEBFA;
    --text: #D6D7EE;
    --muted: #A3A8CC;
    --accent: #F4AFCB;
    --line: rgba(236, 235, 250, 0.24);
    --font-body: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-script: 'Caveat', 'Segoe Script', 'Bradley Hand', cursive;
    color-scheme: dark;
  }
  body {
    background-color: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
  }
  .sky {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(60% 40% at 78% 18%, rgba(110, 80, 190, 0.16), transparent 70%),
      radial-gradient(50% 35% at 14% 72%, rgba(50, 110, 190, 0.13), transparent 70%),
      linear-gradient(180deg, #141A3D 0%, #0C1030 45%, #070918 100%);
  }
  .sky canvas { display: block; width: 100%; height: 100%; }

  .page {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    min-width: 0;
    padding-block: 1.25rem 2.5rem;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .stage {
    width: min(100%, 420px);
    touch-action: pan-y;
    transition: opacity 0.22s ease;
  }
  .stage svg { display: block; width: 100%; height: auto; overflow: visible; }

  .controls { display: flex; align-items: center; gap: 0.75rem; }
  .arrow {
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    color: var(--fg);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--line);
    border-radius: 50%;
    cursor: pointer;
  }
  .arrow:hover { background: rgba(255, 255, 255, 0.14); }
  .arrow svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .which { display: flex; flex-direction: column; align-items: center; gap: 0.6rem; min-width: 9rem; }
  .name { font-size: 0.78rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
  .dots { display: flex; align-items: center; gap: 0.5rem; }
  .dot {
    position: relative;
    width: 8px;
    height: 8px;
    padding: 0;
    border: 0;
    border-radius: 4px;
    background: rgba(236, 235, 250, 0.3);
    cursor: pointer;
    transition: width 0.25s ease, background 0.25s ease;
  }
  .dot::before { content: ""; position: absolute; inset: -10px -4px; }
  .dot[aria-current="true"] { width: 20px; background: var(--accent); }
  .arrow:focus-visible, .dot:focus-visible, .replay:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .note { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; text-align: center; margin-top: 0.5rem; }
  h1 {
    margin: 0;
    max-width: 18ch;
    font-family: var(--font-script);
    font-weight: 500;
    font-size: clamp(2.1rem, 8.5vw, 2.8rem);
    line-height: 1.1;
    color: var(--accent);
    text-wrap: balance;
  }
  .note p { margin: 0; max-width: 36ch; line-height: 1.65; color: var(--text); text-wrap: pretty; }
  .replay {
    margin-top: 0.5rem;
    font: inherit;
    font-size: 0.875rem;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.55rem 1.1rem;
    cursor: pointer;
  }
  .replay:hover { color: var(--fg); border-color: var(--fg); }

  /* Базовое состояние элементов уже конечное, анимация только проигрывает путь к нему. */
  .stem { stroke-dasharray: 1; stroke-dashoffset: 0; animation: grow 1.2s ease-out var(--d, 0s) backwards; }
  .bloom { animation: bloom 1s cubic-bezier(.2, 1.2, .4, 1) var(--d, 0s) backwards; }
  .pop { animation: fadeIn 0.7s ease-out var(--d, 0s) backwards; }
  .rise { animation: rise 0.9s ease-out var(--d, 0s) backwards; }
  .msg { animation: fadeUp 1s ease-out 3.6s backwards; }

  @keyframes grow { from { stroke-dashoffset: 1; } }
  @keyframes bloom { from { transform: scale(0) rotate(-45deg); opacity: 0; } }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes rise { from { transform: translateY(46px); opacity: 0; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } }

  @media (prefers-reduced-motion: reduce) {
    .stem, .bloom, .pop, .rise, .msg { animation: none; }
    .stage, .dot { transition: none; }
  }
</style>

<div class="sky" aria-hidden="true"><canvas id="stars"></canvas></div>

<main class="page">
  <div class="stage" id="bouquet"></div>

  <div class="controls">
    <button class="arrow" id="prev" type="button" aria-label="Previous bouquet">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 L8 12 L15 19"></path></svg>
    </button>
    <div class="which">
      <span class="name" id="name" aria-live="polite"></span>
      <div class="dots" id="dots"></div>
    </div>
    <button class="arrow" id="next" type="button" aria-label="Next bouquet">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5 L16 12 L9 19"></path></svg>
    </button>
  </div>

  <div class="note msg" id="note">
    <h1>Only the most beautiful girl can see these flowers</h1>
    <p>Real ones wilt in a week, but these will stay as long as you want. I want your mood to be as high as the stars in the sky. Sending you virtual hugs, hehe.</p>
    <button class="replay" id="replay" type="button">Bloom again</button>
  </div>
</main>

<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var BASE = [200, 440];
  var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* ---------- Звёздное небо ---------- */
  (function sky() {
    var cv = document.getElementById('stars');
    var ctx = cv.getContext('2d');
    var W = 0, H = 0, stars = [], last = 0, resizeT;
    var COLORS = ['255,255,255', '200,215,255', '255,240,215'];

    function build() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var n = Math.max(90, Math.min(420, Math.round(W * H / 4500)));
      var r = rng(42);
      stars = [];
      for (var i = 0; i < n; i++) {
        var size = Math.pow(r(), 3) * 1.1 + 0.35;
        stars.push({
          x: r() * W, y: r() * H, r: size,
          a: 0.25 + r() * 0.5,
          ph: r() * 6.283, sp: 0.4 + r() * 1.2,
          c: COLORS[Math.floor(r() * COLORS.length)]
        });
      }
      draw(0);
    }
    function draw(t) {
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        var a = s.a * (0.78 + 0.22 * Math.sin(t * s.sp + s.ph));
        if (s.r > 0.9) {
          var g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 6);
          g.addColorStop(0, 'rgba(' + s.c + ',' + (a * 0.32).toFixed(3) + ')');
          g.addColorStop(1, 'rgba(' + s.c + ',0)');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 6, 0, 6.2832); ctx.fill();
          ctx.strokeStyle = 'rgba(' + s.c + ',' + (a * 0.35).toFixed(3) + ')';
          ctx.lineWidth = 0.5;
          ctx.beginPath();
          ctx.moveTo(s.x - s.r * 5, s.y); ctx.lineTo(s.x + s.r * 5, s.y);
          ctx.moveTo(s.x, s.y - s.r * 5); ctx.lineTo(s.x, s.y + s.r * 5);
          ctx.stroke();
        }
        ctx.fillStyle = 'rgba(' + s.c + ',' + a.toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.2832); ctx.fill();
      }
    }
    function loop(ts) {
      if (ts - last > 42) { last = ts; draw(ts / 1000); }
      requestAnimationFrame(loop);
    }
    build();
    if (!reduce) requestAnimationFrame(loop);
    window.addEventListener('resize', function () {
      clearTimeout(resizeT);
      resizeT = setTimeout(build, 150);
    });
  })();

  /* ---------- Цветы ---------- */
  // палитры: [светлый, средний, тёмный]
  var PAL = {
    rose:    ['#FFD1E0', '#F0709A', '#9E2250'],
    blush:   ['#FFF1F5', '#F7BCCD', '#C97C95'],
    coral:   ['#FFC6AE', '#F47B5C', '#A93720'],
    red:     ['#FF8A8A', '#D1203A', '#650A1C'],
    daisy:   ['#FFFFFF', '#F6F5E8', '#CBC79E'],
    sun:     ['#FFE45C', '#F6B100', '#C96A06'],
    lilac:   ['#E7DAFF', '#A78AE8', '#5A3FA6'],
    tpink:   ['#FFB8D2', '#EE5A98', '#A01F5E'],
    tred:    ['#FF8F8F', '#D61F3A', '#7A0F24'],
    tyellow: ['#FFF59A', '#FFC21A', '#D07F00']
  };
  var SHAPES = {
    peony: 'M0 0 C-17 -4 -22 -26 -11 -37 C-5 -42 5 -42 11 -37 C22 -26 17 -4 0 0Z',
    rose:  'M0 0 C-22 -2 -27 -24 -13 -33 C-5 -37 5 -37 13 -33 C27 -24 22 -2 0 0Z',
    daisy: 'M0 0 C-5 -4 -6.5 -20 -3 -30 Q0 -34 3 -30 C6.5 -20 5 -4 0 0Z',
    sun:   'M0 0 C-9 -6 -10 -24 0 -42 C10 -24 9 -6 0 0Z'
  };
  var TULIP = 'M0 0 C-21 -4 -23 -30 0 -52 C23 -30 21 -4 0 0Z';
  var VEINS = ['M0 -4 L0 -31', 'M-1 -5 Q-8 -17 -9 -30', 'M1 -5 Q8 -17 9 -30'];
  var CAST_R = { peony: 50, rose: 38, daisy: 38, sunflower: 56, tulip: 34 };

  function lin(defs, id, x1, y1, x2, y2, stops) {
    var g = el('linearGradient', { id: id, x1: x1, y1: y1, x2: x2, y2: y2 }, defs);
    stops.forEach(function (s) { el('stop', { offset: s[0], 'stop-color': s[1] }, g); });
  }
  function rad(defs, id, cx, cy, r, stops) {
    var g = el('radialGradient', { id: id, cx: cx, cy: cy, r: r }, defs);
    stops.forEach(function (s) {
      el('stop', { offset: s[0], 'stop-color': s[1], 'stop-opacity': s[2] === undefined ? 1 : s[2] }, g);
    });
  }

  function buildDefs(svg, bq) {
    var defs = el('defs', {}, svg);
    var f1 = el('filter', { id: 'shs', x: '-30%', y: '-30%', width: '160%', height: '170%' }, defs);
    el('feDropShadow', { dx: 0, dy: 1.4, stdDeviation: 1.3, 'flood-color': '#000', 'flood-opacity': 0.5 }, f1);
    var f2 = el('filter', { id: 'shw', x: '-30%', y: '-30%', width: '160%', height: '170%' }, defs);
    el('feDropShadow', { dx: 0, dy: 4, stdDeviation: 4, 'flood-color': '#000', 'flood-opacity': 0.55 }, f2);
    var f3 = el('filter', { id: 'blur5', x: '-50%', y: '-150%', width: '200%', height: '400%' }, defs);
    el('feGaussianBlur', { stdDeviation: 5 }, f3);

    Object.keys(PAL).forEach(function (k) {
      var p = PAL[k];
      lin(defs, 'pg-' + k, 0, 1, 0, 0, [[0, p[2]], [0.55, p[1]], [1, p[0]]]);
    });
    lin(defs, 'lg-leaf', 0, 0, 1, 0, [[0, '#1B4E31'], [0.5, '#3B8A52'], [1, '#79C48A']]);
    rad(defs, 'cast', 0.5, 0.5, 0.5, [[0, '#000', 0.55], [0.55, '#000', 0.28], [1, '#000', 0]]);
    rad(defs, 'halo', 0.5, 0.5, 0.5, [[0, '#AAB4FF', 0.16], [1, '#AAB4FF', 0]]);
    rad(defs, 'disc-sun', 0.4, 0.35, 0.7, [[0, '#7A4A1E'], [0.6, '#3B2410'], [1, '#1E1208']]);
    rad(defs, 'disc-daisy', 0.4, 0.35, 0.7, [[0, '#FFE680'], [0.6, '#F0B800'], [1, '#A87100']]);
    rad(defs, 'gyp', 0.35, 0.3, 0.75, [[0, '#FFFFFF'], [0.6, '#E9ECF5'], [1, '#B6BDD0']]);

    var w = bq.wrap, r = bq.ribbon;
    lin(defs, 'wr-back', 0, 0, 1, 0, [[0, w.c], [0.5, w.a], [1, w.c]]);
    lin(defs, 'wr-front', 0, 0, 1, 0, [[0, w.c], [0.3, w.a], [0.55, w.b], [0.8, w.a], [1, w.c]]);
    lin(defs, 'rb', 0, 0, 0, 1, [[0, r[0]], [0.5, r[1]], [1, r[2]]]);
    return defs;
  }

  function ring(g, shape, key, n, d, sc, rot, rand, veins) {
    var rg = el('g', { filter: 'url(#shs)' }, g);
    var p = PAL[key];
    for (var i = 0; i < n; i++) {
      var a = rot + 360 * i / n + (rand() - 0.5) * 9;
      var sx = sc * (0.92 + rand() * 0.16), sy = sc * (0.9 + rand() * 0.2);
      var pg = el('g', {
        transform: 'rotate(' + a.toFixed(1) + ') translate(0 ' + (-d) + ') scale(' + sx.toFixed(3) + ' ' + sy.toFixed(3) + ')'
      }, rg);
      el('path', { d: shape, fill: 'url(#pg-' + key + ')', stroke: p[0], 'stroke-opacity': 0.4, 'stroke-width': 0.9 }, pg);
      if (veins) {
        for (var v = 0; v < VEINS.length; v++) {
          el('path', { d: VEINS[v], fill: 'none', stroke: p[2], 'stroke-opacity': 0.28, 'stroke-width': 0.7, 'stroke-linecap': 'round' }, pg);
        }
      }
    }
  }

  function peony(g, s, key, rand) {
    var g2 = el('g', { transform: 'scale(' + s + ')' }, g);
    ring(g2, SHAPES.peony, key, 10, 5, 1.15, 0, rand, true);
    ring(g2, SHAPES.peony, key, 9, 3, 0.92, 18, rand, true);
    ring(g2, SHAPES.peony, key, 7, 1.5, 0.7, 10, rand, false);
    ring(g2, SHAPES.peony, key, 5, 0, 0.48, 30, rand, false);
    el('circle', { cx: 0, cy: 0, r: 5.5, fill: PAL[key][2], 'fill-opacity': 0.8 }, g2);
    for (var i = 0; i < 9; i++) {
      var a = Math.PI * 2 * i / 9;
      el('circle', { cx: (Math.cos(a) * 4).toFixed(1), cy: (Math.sin(a) * 4).toFixed(1), r: 1.1, fill: '#F6C445' }, g2);
    }
  }
  function rose(g, s, key, rand) {
    var g2 = el('g', { transform: 'scale(' + s + ')' }, g);
    ring(g2, SHAPES.rose, key, 6, 3, 1.0, 0, rand, true);
    ring(g2, SHAPES.rose, key, 5, 2, 0.78, 25, rand, true);
    ring(g2, SHAPES.rose, key, 5, 1, 0.56, 50, rand, false);
    ring(g2, SHAPES.rose, key, 4, 0, 0.36, 10, rand, false);
    el('path', {
      d: 'M0 -1 C3 -1 4 3 1 4.5 C-3 6 -6 1 -4 -3 C-2 -7 4 -7 6 -3',
      fill: 'none', stroke: PAL[key][2], 'stroke-opacity': 0.7, 'stroke-width': 1.2, 'stroke-linecap': 'round'
    }, g2);
  }
  function daisy(g, s, rand) {
    var g2 = el('g', { transform: 'scale(' + s + ')' }, g);
    ring(g2, SHAPES.daisy, 'daisy', 16, 8, 0.95, 11, rand, false);
    ring(g2, SHAPES.daisy, 'daisy', 16, 8, 1, 0, rand, false);
    el('circle', { cx: 0, cy: 0, r: 9.5, fill: 'url(#disc-daisy)', stroke: '#7A4E00', 'stroke-opacity': 0.5, 'stroke-width': 1 }, g2);
    for (var i = 0; i < 16; i++) {
      var a = rand() * 6.283, rr = rand() * 7;
      el('circle', { cx: (Math.cos(a) * rr).toFixed(1), cy: (Math.sin(a) * rr).toFixed(1), r: 0.8, fill: '#8A5A00', 'fill-opacity': 0.5 }, g2);
    }
    el('ellipse', { cx: -2.5, cy: -3, rx: 3, ry: 2, fill: '#fff', 'fill-opacity': 0.35 }, g2);
  }
  function sunflower(g, s, rand) {
    var g2 = el('g', { transform: 'scale(' + s + ')' }, g);
    ring(g2, SHAPES.sun, 'sun', 16, 14, 0.95, 11, rand, false);
    ring(g2, SHAPES.sun, 'sun', 16, 14, 1, 0, rand, false);
    el('circle', { cx: 0, cy: 0, r: 17, fill: 'url(#disc-sun)', stroke: '#2A1708', 'stroke-width': 1.2 }, g2);
    for (var i = 0; i < 85; i++) {
      var a = i * 2.39996, rr = 1.7 * Math.sqrt(i);
      el('circle', {
        cx: (Math.cos(a) * rr).toFixed(1), cy: (Math.sin(a) * rr).toFixed(1),
        r: (0.8 + rr * 0.02).toFixed(2), fill: i % 2 ? '#C98A2B' : '#6B3F14', 'fill-opacity': 0.85
      }, g2);
    }
    el('path', {
      d: 'M-11 -8 A13 13 0 0 1 -2 -13', fill: 'none', stroke: '#FFD9A0', 'stroke-opacity': 0.25,
      'stroke-width': 1.6, 'stroke-linecap': 'round'
    }, g2);
  }
  function tulip(g, s, key, rot) {
    var p = PAL[key];
    var g1 = el('g', { transform: 'rotate(' + rot + ') translate(0 ' + (24 * s).toFixed(1) + ') scale(' + s + ')' }, g);
    [-1, 1].forEach(function (sd) {
      var bg = el('g', { transform: 'rotate(' + (sd * 17) + ') scale(0.88 0.96)', filter: 'url(#shs)' }, g1);
      el('path', { d: TULIP, fill: 'url(#pg-' + key + ')', stroke: p[2], 'stroke-opacity': 0.5, 'stroke-width': 0.8 }, bg);
      el('path', { d: TULIP, fill: '#000', 'fill-opacity': 0.22 }, bg);
    });
    var fg = el('g', { filter: 'url(#shs)' }, g1);
    el('path', { d: TULIP, fill: 'url(#pg-' + key + ')', stroke: p[0], 'stroke-opacity': 0.45, 'stroke-width': 0.9 }, fg);
    el('path', { d: 'M-9 -8 C-14 -24 -9 -40 -2 -48', fill: 'none', stroke: '#fff', 'stroke-opacity': 0.35, 'stroke-width': 2.2, 'stroke-linecap': 'round' }, fg);
    el('path', { d: 'M8 -6 C14 -20 11 -34 5 -44', fill: 'none', stroke: p[2], 'stroke-opacity': 0.3, 'stroke-width': 1.4, 'stroke-linecap': 'round' }, fg);
  }

  function leaf(g, lf, i) {
    var L = lf.len, w = lf.w;
    var outer = el('g', { transform: 'translate(' + lf.x + ' ' + lf.y + ') rotate(' + lf.rot + ')' }, g);
    var inner = el('g', { 'class': 'bloom', style: '--d:' + (0.9 + i * 0.08).toFixed(2) + 's' }, outer);
    var top = 'M0 0 C' + (L * 0.2) + ' ' + (-w) + ' ' + (L * 0.65) + ' ' + (-w * 0.9) + ' ' + L + ' 0';
    el('path', { d: top + ' C' + (L * 0.65) + ' ' + (w * 0.9) + ' ' + (L * 0.2) + ' ' + w + ' 0 0Z', fill: 'url(#lg-leaf)', stroke: '#12351f', 'stroke-opacity': 0.55, 'stroke-width': 0.8 }, inner);
    el('path', { d: top + 'Z', fill: '#fff', 'fill-opacity': 0.09 }, inner);
    el('path', { d: 'M0 0 Q' + (L * 0.5) + ' ' + (-w * 0.06) + ' ' + L + ' 0', fill: 'none', stroke: '#B4E8B4', 'stroke-opacity': 0.55, 'stroke-width': 0.9 }, inner);
    for (var j = 1; j <= 4; j++) {
      var x = L * (0.12 + 0.16 * j);
      [-1, 1].forEach(function (sd) {
        el('path', {
          d: 'M' + x.toFixed(1) + ' 0 L' + (x + L * 0.13).toFixed(1) + ' ' + (sd * w * 0.62).toFixed(1),
          fill: 'none', stroke: '#B4E8B4', 'stroke-opacity': 0.28, 'stroke-width': 0.6
        }, inner);
      });
    }
  }

  function stemPath(x, y) {
    var c = [200 + (x - 200) * 0.25, (BASE[1] + y) / 2];
    return { d: 'M' + BASE[0] + ' ' + BASE[1] + ' Q' + c[0] + ' ' + c[1] + ' ' + x + ' ' + y, c: c };
  }
  function qpoint(p0, c, p1, t) {
    var u = 1 - t;
    return [u * u * p0[0] + 2 * u * t * c[0] + t * t * p1[0], u * u * p0[1] + 2 * u * t * c[1] + t * t * p1[1]];
  }
  function stemPair(g, d, delay, w) {
    var dl = delay.toFixed(2);
    el('path', { d: d, pathLength: 1, 'class': 'stem', style: '--d:' + dl + 's;stroke:#1E4B34;stroke-width:' + (4 * w) }, g);
    el('path', { d: d, pathLength: 1, 'class': 'stem', transform: 'translate(-0.6 0)', style: '--d:' + dl + 's;stroke:#5FA872;stroke-width:' + (2 * w) }, g);
  }
  function cluster(g, cx, cy, rand) {
    for (var i = 0; i < 7; i++) {
      var a = rand() * 6.283, d = rand() * 9;
      el('circle', {
        cx: (cx + Math.cos(a) * d).toFixed(1), cy: (cy + Math.sin(a) * d * 0.8).toFixed(1),
        r: (2.1 + rand() * 1.4).toFixed(1), fill: 'url(#gyp)'
      }, g);
    }
  }
  function sprig(stemsG, flowersG, sp, i, rand) {
    var path = stemPath(sp.x, sp.y);
    var sd = 0.35 + i * 0.07;
    stemPair(stemsG, path.d, sd, 0.62);
    var dots = el('g', { 'class': 'pop', style: '--d:' + (sd + 0.9).toFixed(2) + 's' }, flowersG);
    var p1 = [sp.x, sp.y], k;
    if (sp.k === 'lav') {
      for (k = 0; k < 16; k++) {
        var t = 0.56 + k * 0.028;
        var p = qpoint(BASE, path.c, p1, t);
        var side = k % 2 ? 1 : -1;
        var sc = 1.1 - (t - 0.56) * 1.4;
        var fl = el('g', {
          transform: 'translate(' + (p[0] + side * 3).toFixed(1) + ' ' + p[1].toFixed(1) + ') rotate(' + (side * 38) + ') scale(' + sc.toFixed(2) + ')'
        }, dots);
        el('ellipse', { cx: 0, cy: -4, rx: 3, ry: 5, fill: 'url(#pg-lilac)', stroke: PAL.lilac[2], 'stroke-opacity': 0.4, 'stroke-width': 0.5 }, fl);
      }
      el('circle', { cx: sp.x, cy: sp.y - 2, r: 2.4, fill: 'url(#pg-lilac)' }, dots);
    } else {
      var t0 = qpoint(BASE, path.c, p1, 0.78);
      var tw = [[-13, -9], [11, -14], [1, -20]];
      tw.forEach(function (o) {
        el('path', { d: 'M' + t0[0].toFixed(1) + ' ' + t0[1].toFixed(1) + ' L' + (sp.x + o[0]) + ' ' + (sp.y + o[1]), stroke: '#4F8F62', 'stroke-width': 0.9, fill: 'none' }, dots);
      });
      tw.forEach(function (o) { cluster(dots, sp.x + o[0], sp.y + o[1], rand); });
      cluster(dots, sp.x, sp.y, rand);
    }
  }

  function drawWrap(svg, bq) {
    var BACK = 'M88 372 L312 372 L238 536 Q200 548 162 536 Z';

    var body = el('g', { filter: 'url(#shw)' }, wrap);
    el('path', { d: BACK, fill: 'url(#wr-back)', stroke: '#000', 'stroke-opacity': 0.25, 'stroke-width': 0.8 }, body);
    var sh = el('g', { 'clip-path': 'url(#wrapclip)' }, body);
    el('ellipse', { cx: 200, cy: 378, rx: 100, ry: 12, fill: '#000', 'fill-opacity': 0.5, filter: 'url(#blur5)' }, sh);
    el('path', { d: 'M88 372 Q200 432 312 372 L238 536 Q200 548 162 536 Z', fill: 'url(#wr-front)', stroke: '#000', 'stroke-opacity': 0.25, 'stroke-width': 0.8 }, body);
    el('path', { d: 'M150 402 L176 539', fill: 'none', stroke: '#000', 'stroke-opacity': 0.16, 'stroke-width': 1.4 }, body);
    el('path', { d: 'M152 402 L178 539', fill: 'none', stroke: '#fff', 'stroke-opacity': 0.12, 'stroke-width': 1 }, body);
    el('path', { d: 'M250 402 L224 539', fill: 'none', stroke: '#000', 'stroke-opacity': 0.16, 'stroke-width': 1.4 }, body);

    var bow = el('g', { filter: 'url(#shs)' }, wrap);
    var edge = { stroke: '#000', 'stroke-opacity': 0.3, 'stroke-width': 0.8 };
    function rb(d, extra) {
      var a = { d: d, fill: 'url(#rb)', stroke: edge.stroke, 'stroke-opacity': edge['stroke-opacity'], 'stroke-width': edge['stroke-width'] };
      for (var k in extra) a[k] = extra[k];

    }
    rb('M132 466 Q200 482 268 466 L261 486 Q200 502 139 486 Z');
    rb('M200 488 C170 462 152 482 160 498 C170 510 192 496 200 488 Z');
    rb('M200 488 C230 462 248 482 240 498 C230 510 208 496 200 488 Z');

    el('path', { d: 'M202 488 C222 474 234 484 231 494', fill: 'none', stroke: '#000', 'stroke-opacity': 0.25, 'stroke-width': 1 }, bow);
    rb('M196 492 L186 528 L196 522 L200 532 L202 494 Z');
    rb('M204 492 L214 528 L204 522 L200 532 L198 494 Z');
    el('circle', { cx: 200, cy: 489, r: 6, fill: 'url(#rb)', stroke: '#000', 'stroke-opacity': 0.3, 'stroke-width': 0.8 }, bow);
  }

  /* ---------- Букеты ---------- */
  var LEAF_STD = [

    { x: 190, y: 380, rot: -105, len: 68, w: 21 }, { x: 212, y: 380, rot: -75, len: 68, w: 21 }
  ];
  var BOUQUETS = [
    {

      wrap: { a: '#6F9C98', b: '#9CC6C0', c: '#3F6965' },

      ],
      sprigs: [

    },
    {

        { x: 180, y: 395, rot: -118, len: 150, w: 15 }, { x: 220, y: 395, rot: -62, len: 150, w: 15 },
        { x: 165, y: 400, rot: -145, len: 130, w: 13 }, { x: 235, y: 400, rot: -35, len: 130, w: 13 }
      ],
      flowers: [
        { t: 'tulip', x: 200, y: 150, s: 1.1, k: 'tpink', rot: 0 },
        { t: 'tulip', x: 120, y: 210, s: 1.0, k: 'tred', rot: -10 },
        { t: 'tulip', x: 282, y: 206, s: 1.0, k: 'tyellow', rot: 10 },
        { t: 'tulip', x: 160, y: 290, s: 1.0, k: 'tyellow', rot: -6 },
        { t: 'tulip', x: 246, y: 292, s: 1.0, k: 'tpink', rot: 6 },
        { t: 'tulip', x: 78, y: 300, s: 0.95, k: 'tred', rot: -18 },
        { t: 'tulip', x: 324, y: 296, s: 0.95, k: 'tpink', rot: 18 }
      ],
      sprigs: [
        { k: 'gyp', x: 60, y: 180 }, { k: 'gyp', x: 340, y: 170 }, { k: 'gyp', x: 46, y: 260 },
        { k: 'gyp', x: 356, y: 250 }, { k: 'gyp', x: 165, y: 60 }, { k: 'gyp', x: 240, y: 58 }
      ]
    },
    {
      name: 'Roses',
      wrap: { a: '#5F73A8', b: '#8A9DD0', c: '#34426F' },
      ribbon: ['#FFE9A6', '#D9B45A', '#8A6A22'],
      leaves: LEAF_STD,
      flowers: [
        { t: 'rose', x: 200, y: 165, s: 1.25, k: 'red' },
        { t: 'rose', x: 115, y: 232, s: 1.1, k: 'red' },
        { t: 'rose', x: 288, y: 230, s: 1.1, k: 'red' },
        { t: 'rose', x: 152, y: 318, s: 0.95, k: 'red' },
        { t: 'rose', x: 250, y: 322, s: 0.95, k: 'rose' }
      ],
      sprigs: [
        { k: 'gyp', x: 52, y: 200 }, { k: 'gyp', x: 348, y: 196 }, { k: 'gyp', x: 70, y: 110 }, { k: 'gyp', x: 330, y: 104 },
        { k: 'gyp', x: 160, y: 40 }, { k: 'gyp', x: 240, y: 38 }, { k: 'gyp', x: 36, y: 290 }, { k: 'gyp', x: 364, y: 286 }
      ]
    }
  ];

  var idx = 0, N = BOUQUETS.length, fadeTimer;
  var stage = document.getElementById('bouquet');
  var nameEl = document.getElementById('name');
  var dotsEl = document.getElementById('dots');

  function render() {
    var bq = BOUQUETS[idx];
    stage.textContent = '';
    var svg = el('svg', {
      viewBox: '0 0 400 560', role: 'img',
      'aria-label': 'Bouquet of ' + bq.name.toLowerCase() + ' in paper wrapping with a bow'
    }, stage);
    buildDefs(svg, bq);
    el('circle', { cx: 200, cy: 250, r: 230, fill: 'url(#halo)' }, svg);
    var rand = rng(7 + idx * 13);

    var leavesG = el('g', { filter: 'url(#shs)' }, svg);
    bq.leaves.forEach(function (lf, i) { leaf(leavesG, lf, i); });

    var stemsG = el('g', { fill: 'none', 'stroke-linecap': 'round' }, svg);
    var flowersG = el('g', {}, svg);

    bq.sprigs.forEach(function (sp, i) { sprig(stemsG, flowersG, sp, i, rand); });
    bq.flowers.forEach(function (f, i) {
      stemPair(stemsG, stemPath(f.x, f.y).d, 0.3 + i * 0.07, 1);
    });

    var order = bq.flowers.map(function (f, i) { return { f: f, i: i }; })
      .sort(function (a, b) { return a.f.y - b.f.y; });
    order.forEach(function (o) {
      var f = o.f;
      var outer = el('g', { transform: 'translate(' + f.x + ' ' + f.y + ')' }, flowersG);
      var inner = el('g', { 'class': 'bloom', style: '--d:' + (1.2 + o.i * 0.2).toFixed(2) + 's' }, outer);
      el('circle', { cx: 3, cy: 6, r: (CAST_R[f.t] * f.s * 1.2).toFixed(1), fill: 'url(#cast)' }, inner);
      if (f.t === 'peony') peony(inner, f.s, f.k, rand);
      else if (f.t === 'rose') rose(inner, f.s, f.k, rand);
      else if (f.t === 'daisy') daisy(inner, f.s, rand);
      else if (f.t === 'sunflower') sunflower(inner, f.s, rand);
      else tulip(inner, f.s, f.k, f.rot || 0);
    });

    drawWrap(svg, bq);
  }

  function ui() {
    nameEl.textContent = BOUQUETS[idx].name;
    var dots = dotsEl.children;
    for (var i = 0; i < dots.length; i++) {
      if (i === idx) dots[i].setAttribute('aria-current', 'true');
      else dots[i].removeAttribute('aria-current');
    }
  }
  function show() {
    ui();
    if (reduce) { render(); return; }
    stage.style.opacity = 0;
    clearTimeout(fadeTimer);
    fadeTimer = setTimeout(function () { render(); stage.style.opacity = 1; }, 220);
  }
  function go(d) { idx = (idx + d + N) % N; show(); }
  function goTo(i) { if (i !== idx) { idx = i; show(); } }

  BOUQUETS.forEach(function (b, i) {
    var d = document.createElement('button');
    d.type = 'button';
    d.className = 'dot';
    d.setAttribute('aria-label', 'Show bouquet ' + (i + 1) + ': ' + b.name);
    d.addEventListener('click', function () { goTo(i); });
    dotsEl.appendChild(d);
  });

  document.getElementById('prev').addEventListener('click', function () { go(-1); });
  document.getElementById('next').addEventListener('click', function () { go(1); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') go(-1);
    else if (e.key === 'ArrowRight') go(1);
  });
  var sx = null;
  stage.addEventListener('pointerdown', function (e) { sx = e.clientX; });
  stage.addEventListener('pointercancel', function () { sx = null; });
  stage.addEventListener('pointerup', function (e) {
    if (sx === null) return;
    var dx = e.clientX - sx; sx = null;
    if (Math.abs(dx) > 45) go(dx < 0 ? 1 : -1);
  });

  function restartNote() {
    var n = document.getElementById('note');
    n.classList.remove('msg');
    void n.offsetWidth;
    n.classList.add('msg');
  }
  document.getElementById('replay').addEventListener('click', function () {
    render();
    restartNote();
  });

  ui();
  render();
})();
</script>
